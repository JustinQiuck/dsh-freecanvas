# dsh-plugin-freecanvas bundle patch: registers the DSH FreeCanvas web embed
# into a DSH profile roster. The node half (exports ".") runs in the host
# process; the `dsh.client` declaration in package.json makes the browser half
# (exports "./client") load in the web GUI, mounting a sidebar entry and a
# full center iframe that hosts the canvas URL.
- insert:
    - id: ui-dsh-freecanvas
      name: 'dsh-plugin-freecanvas'
